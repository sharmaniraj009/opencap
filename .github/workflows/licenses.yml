name: Licences

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * *"          # nightly: the desktop gate also checks new RustSec advisories
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python licence gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install .[all,dev] in a clean venv
        run: |
          python -m venv /tmp/lic-venv
          /tmp/lic-venv/bin/pip install --upgrade pip
          /tmp/lic-venv/bin/pip install '.[all,dev]' pip-licenses   # pip-licenses: MIT, test-only
      - name: Check licences against licenses/python-allow.toml
        run: /tmp/lic-venv/bin/python scripts/check_licenses.py

  rust:
    name: Rust licence gate (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Detect engine/
        id: detect
        run: |
          if [ -f engine/Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::engine/Cargo.toml not found: Rust licence gate skipped"; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: cargo deny check licenses bans sources
        if: steps.detect.outputs.present == 'true'
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          manifest-path: engine/Cargo.toml
          command: check licenses bans sources
          arguments: --config deny.toml

  desktop:
    name: Desktop licence and advisory gate (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2        # HEAD^1: the base branch tip (PR merge commit) or the previous main
      - name: Does this change touch desktop/?
        id: detect
        # Runs on PRs and pushes to main that touch desktop/ (or this workflow), nightly and on
        # manual dispatch. Advisories change without any commit here, so a new RustSec entry
        # shows up in the nightly run instead of failing unrelated PRs.
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! files="$(git diff --name-only HEAD^1 HEAD)"; then
            echo "::warning::could not list the changed files; running the desktop gate"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if grep -Eq '^(desktop/|\.github/workflows/licenses\.yml$)' <<< "$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::desktop/ unchanged: desktop licence gate skipped"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: cargo deny check licenses bans sources advisories (desktop/deny.toml)
        if: steps.detect.outputs.run == 'true'
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          manifest-path: desktop/Cargo.toml
          command: check licenses bans sources advisories
