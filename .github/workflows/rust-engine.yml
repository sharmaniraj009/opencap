name: Rust engine

# The Rust engine in engine/ (docs/rfc/0001-rust-engine.md): format, lint, unit tests and the
# licence gate (ADR-0007), then conformance against the Python reference (ADR-0014): golden
# payloads, CLI parity, outbox interchange, and every acceptance suite driven against the Rust
# release binary (OPENCAP_ENGINE=rust), with the same simulators, broker and assertions as
# Python. Suites for drivers not ported yet skip as "driver not ported"; the job summary lists
# the port gap. Runs on pull requests and pushes that touch the engine or the suites, and nightly.

on:
  push:
    branches: [main]          # other branches run through their pull request (#38)
    paths: ["engine/**", "src/**", "tests/**", "config/**", "pyproject.toml", ".github/workflows/rust-engine.yml"]
  pull_request:
    paths: ["engine/**", "src/**", "tests/**", "config/**", "pyproject.toml", ".github/workflows/rust-engine.yml"]
  schedule:
    - cron: "41 2 * * *"          # nightly, after CI's Python acceptance run (UTC)
  workflow_dispatch:
    inputs:
      outage_s:
        description: "Broker outage in the Phase 1 acceptance test, seconds"
        required: false
        default: "8"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-test:
    name: cargo fmt, clippy, test, deny
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-18
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
          shared-key: engine
      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Licence and supply-chain gate (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          manifest-path: engine/Cargo.toml
          command: check licenses bans sources
      - name: Advisories (RustSec)
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          manifest-path: engine/Cargo.toml
          command: check advisories

  conformance:
    name: conformance vs the Python reference
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-18
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
          shared-key: engine
          save-if: false
      - name: Build the engine binary
        working-directory: engine
        run: cargo build --locked -p opencap-engine
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the Python reference and test harness
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,modbus,north,serial,melsec]'
      - name: Golden payloads, CLI parity, outbox interchange, API and reload
        env:
          OPENCAP_ENGINE_BIN: engine/target/debug/opencap-engine
        run: >
          pytest -ra tests/unit/test_payload_golden.py
          tests/integration/test_rust_engine_cli.py tests/integration/test_rust_engine_outbox.py
          tests/integration/test_rust_engine_api.py tests/integration/test_engine_harness.py
          tests/integration/test_rust_engine_rtu.py tests/integration/test_rust_engine_melsec.py
      - name: Config conformance, Rust models vs Python models (#39)
        run: |
          cargo build --locked --manifest-path engine/Cargo.toml -p opencap-core --example config_dump
          python tests/conformance/config/compare.py --dumper engine/target/debug/examples/config_dump
      - name: Engine log on failure
        if: failure()
        run: find /tmp -name engine.log -exec sh -c 'echo "== $1"; tail -n 80 "$1"' _ {} \;

  acceptance-rust:
    name: acceptance suites against the Rust engine (release build)
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-18
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
          shared-key: engine-release
      - name: Build the engine binary (release)
        working-directory: engine
        run: cargo build --locked --release -p opencap-engine
      - name: Drivers this build implements
        run: engine/target/release/opencap-engine drivers
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the Python reference and test harness
        # every driver extra: a suite whose library is missing would skip at collection and
        # vanish from the port-gap summary instead of showing as "driver not ported"
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,all]'
      - name: Acceptance suites with OPENCAP_ENGINE=rust (port gap in the job summary)
        env:
          OPENCAP_ENGINE: rust
          OPENCAP_ENGINE_BIN: engine/target/release/opencap-engine
          OPENCAP_OUTAGE_S: ${{ inputs.outage_s || '8' }}
        run: pytest -m acceptance -ra -s
      - name: Engine log on failure
        if: failure()
        run: find /tmp -name engine.log -path '*rust-engine*' -exec sh -c 'echo "== $1"; tail -n 80 "$1"' _ {} \;

  windows:
    name: build and test on Windows (informational)
    runs-on: windows-latest
    timeout-minutes: 40
    # Desktop/service target (ADR-0010). Informational until the Windows CI issue (#35) makes it required.
    continue-on-error: true
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-18
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
      - name: Build
        run: cargo build --locked --all-targets
      - name: Test
        run: cargo test --locked
