# Engine benchmark (#7, bench/README.md). Manual only: never part of the PR or push checks.
# Runs one profile against the Python engine (and, optionally, the Rust engine) on the standard
# ubuntu-latest runner and uploads the JSON results.
name: bench

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Tag count (125 tags per device): 1k, 10k, 25k or 50k"
        required: false
        default: "1k"
      duration:
        description: "Measurement window, seconds"
        required: false
        default: "60"
      rust:
        description: "Also run the Rust engine (release build)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the Python reference and the test helpers' dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,all]'
      - name: Harness self-test
        run: pytest -q bench/test_bench.py
      - name: Python engine
        env:
          PROFILE: ${{ inputs.profile }}
          DURATION: ${{ inputs.duration }}
        run: python bench/run.py --engine python --profile "$PROFILE" --duration "$DURATION" --out bench-results.jsonl
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-18
        if: inputs.rust
      - name: Build the Rust engine
        if: inputs.rust
        working-directory: engine
        run: cargo build --locked --release -p opencap-engine
      - name: Rust engine
        if: inputs.rust
        env:
          PROFILE: ${{ inputs.profile }}
          DURATION: ${{ inputs.duration }}
        run: >
          python bench/run.py --engine rust --binary engine/target/release/opencap-engine
          --profile "$PROFILE" --duration "$DURATION" --out bench-results.jsonl
      - name: Engine log on failure
        if: failure()
        run: tail -n 80 bench/work/engine.log || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-${{ inputs.profile }}
          path: bench-results.jsonl
          if-no-files-found: ignore
