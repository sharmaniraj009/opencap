# poller.yaml: global opencap settings (model: opencap.config.models.PollerConfig).
# Every key is optional; a missing file means all defaults. Unknown keys are an error.
# Secrets are never stored here: only the NAMES of environment variables that hold them.

instance: opencap-1            # used in the LWT topic <topic_prefix>/poller/<instance>/status

mqtt:
  host: localhost
  port: 1883                     # 8883 with TLS
  tls: false                     # isSecure in the payload is true only when this is true
  ca_file: null                  # CA bundle for TLS, e.g. /etc/opencap/ca.pem
  username: null
  password_env: OPENCAP_MQTT_PASSWORD   # env var holding the broker password
  client_id: null                # null = derived from instance
  qos: 1
  keepalive_s: 30
  topic_prefix: opencap          # first level(s) of every derived topic, e.g. acme/plant-1:
                                 #   <prefix>/<channel>/<device>/data|status, <prefix>/poller/<instance>/status
                                 # explicit `topic:` values in devices_map.yaml are used as is

saf:                             # store-and-forward when the broker is down (PLAN 7.3)
  path: data/saf.sqlite
  max_bytes: 2147483648          # 2 GiB, oldest messages dropped first

api:                             # admin + config REST API and the web UI (/ui/): localhost or VPN only
  bind: 127.0.0.1
  port: 8080
  token_env: OPENCAP_API_TOKEN    # env var holding the legacy bearer token (name "default", role admin)
  tokens: []                     # named tokens; the secret is in the env var, never here:
  #  - {name: alice, role: admin, token_env: OPENCAP_TOKEN_ALICE}      # admin: may change the config
  #  - {name: grafana, role: viewer, token_env: OPENCAP_TOKEN_GRAFANA} # viewer: read-only (GET)
  audit_log: data/audit.jsonl    # who changed what in the config, JSON lines
  cors_origins: []               # other web origins allowed to call the API (e.g. the desktop app)

payload:                         # SubDevice JSON (PLAN 7.1)
  float_decimals: 4              # round floats to remove float32 noise
  bad_tags_field: true           # add "BadTags": [...] for tags without good quality
  timezone: Asia/Kolkata         # DateTime is written in this zone

defaults:                        # used by `opencap import-kep` when KEPServer has no value
  scan_ms: 1000
  min_scan_ms: 1000              # "request data no faster than": clamps 10/100 ms KEPServer tags
  timeout_ms: 3000
  retries: 2                     # retries after the first request
  demote_after: 3                # consecutive failed cycles before demotion
  demote_for_ms: 30000

check:                           # `opencap check` cycle-time estimate
  est_rtt_ms: 60.0               # assumed round trip per wire request over the IPsec link
