[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencap"
version = "0.1.0"
description = "Open-source industrial connectivity server: polls PLCs (Modbus, Allen-Bradley, ...) and publishes to MQTT"
license = "Apache-2.0"
authors = [{ name = "opencap contributors" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6",
    "structlog>=24",
]

[project.optional-dependencies]
modbus = ["pymodbus>=3.7"]
ab = ["pycomm3>=1.2"]
s7 = ["python-snap7>=1.3"]
melsec = ["pymcprotocol>=0.3"]
opcua = ["asyncua>=2.1"]   # client state machine, subscription keep-alive tracking (D-028)
north = ["aiomqtt>=2", "fastapi>=0.110", "uvicorn>=0.29", "prometheus-client>=0.20"]
all = ["opencap[modbus,ab,s7,melsec,opcua,north]"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "amqtt>=0.11"]  # amqtt: in-process test broker

[project.scripts]
opencap = "opencap.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = [
    "real_project: needs the real KEPServer export at tests/fixtures/project.json (skipped when absent)",
    "acceptance: end-to-end phase acceptance run (slower; OPENCAP_OUTAGE_S sets the broker outage)",
]
