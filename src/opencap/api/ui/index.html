<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opencap</title>
<link rel="stylesheet" href="app.css">
<!-- app.js registers the components on alpine:init, so it loads first; both are deferred. -->
<script src="app.js" defer></script>
<script src="vendor/alpine-csp-3.17.5.min.js" defer></script>
</head>
<body x-data="shell">
<header class="top">
  <a class="brand" href="#/dashboard">opencap</a>
  <nav class="nav" x-show="app().name" x-cloak>
    <a href="#/dashboard" :aria-current="active('dashboard device') ? 'page' : null" x-text="t('common.dashboard')"></a>
    <a href="#/quick" :aria-current="active('quick') ? 'page' : null" x-text="t('common.quick_client')"></a>
    <a href="#/config" :aria-current="active('config channel edit check') ? 'page' : null" x-text="t('common.config')"></a>
    <a href="#/import" :aria-current="active('import') ? 'page' : null" x-text="t('common.import')"></a>
    <a href="#/audit" :aria-current="active('audit') ? 'page' : null" x-text="t('shell.audit')"></a>
  </nav>
  <div class="who" x-show="app().name" x-cloak>
    <span :class="'role-' + app().role" x-text="userText()"></span>
    <button class="link" x-show="!app().open" @click="logout()" x-text="t('shell.log_out')"></button>
  </div>
  <select :class="app().name ? 'lang' : 'lang end'" name="lang" x-show="languageChoice()" x-cloak x-model="language" @change="pickLanguage()" :aria-label="t('shell.language')">
    <template x-for="l in languageList()" :key="l.code"><option :value="l.code" :selected="l.code === language" x-text="l.name"></option></template>
  </select>
</header>
<div class="banner info" x-show="app().open" x-cloak x-rich="rich('shell.open_mode_banner')"></div>
<div class="banner warn" id="readonly-config" x-show="app().name && isAdmin() && !app().writable" x-cloak x-text="t('shell.readonly_config', {reason: app().writableReason})"></div>
<div class="banner warn" id="pending" x-show="pendingShown()" x-cloak>
  <span x-text="pendingText()"></span>
  <button class="primary small" x-show="canReload()" @click="reload()" x-text="t('shell.reload_now')"></button>
</div>
<div id="flash" x-show="flashText()" x-cloak>
  <div :class="flashClass()" role="status"><span x-text="flashText()"></span><button class="link close" @click="closeFlash()" :aria-label="t('shell.close')">×</button></div>
</div>
<noscript><p class="error">The opencap UI needs JavaScript.</p></noscript>

<main>
<!-- ============================================================ login -->
<template x-if="view('login')">
<section class="login" x-data="loginView" id="view-login">
  <h1 x-text="t('login.log_in')"></h1>
  <p class="muted" x-rich="rich('login.intro')"></p>
  <p class="error" role="alert" x-show="error" x-text="error"></p>
  <form class="stack" @submit.prevent="submit()">
    <label><span x-text="t('login.token')"></span> <input type="password" name="token" autocomplete="off" required x-model="token"></label>
    <button type="submit" class="primary" :disabled="busy" x-text="t('login.log_in')"></button>
  </form>
</section>
</template>

<!-- ============================================================ dashboard -->
<template x-if="view('dashboard')">
<section x-data="dashboardView" id="view-dashboard">
  <div class="toolbar">
    <h1 x-text="t('common.dashboard')"></h1>
    <input type="search" :placeholder="t('common.filter_devices_placeholder')" :aria-label="t('common.filter_devices')" x-model="q">
  </div>
  <p class="error" x-show="error" x-text="error"></p>
  <div class="cards" x-show="data">
    <div class="card"><div class="label" x-text="t('dashboard.mqtt_link')"></div><div :class="mqttClass()" x-text="mqttText()"></div></div>
    <div class="card"><div class="label" x-text="t('dashboard.outbox')"></div><div :class="outboxClass()" x-text="health().saf_queue"></div><div class="sub" x-text="t('dashboard.messages_waiting')"></div></div>
    <div class="card"><div class="label" x-text="t('common.devices')"></div>
      <div class="value"><span class="ok" x-text="stateCount('ok')"></span> / <span class="muted" x-text="stateCount('offline')"></span> / <span class="warn" x-text="stateCount('demoted')"></span></div>
      <div class="sub" x-text="t('dashboard.ok_offline_demoted')"></div></div>
    <div class="card"><div class="label" x-text="t('dashboard.instance')"></div><div class="value small" x-text="health().instance"></div><div class="sub" x-text="health().version"></div></div>
  </div>
  <p class="muted" x-show="noChannels()" x-rich="rich('dashboard.no_channels')"></p>
  <template x-for="ch in sites()" :key="ch.name">
    <section class="site">
      <h2><span x-text="ch.name"></span> <small class="muted" x-text="t('dashboard.devices_n', {n: count(ch.devices)})"></small></h2>
      <table class="devices responsive">
        <thead><tr><th x-text="t('common.device')"></th><th x-text="t('common.driver')"></th><th x-text="t('common.state')"></th><th x-text="t('common.last_good')"></th><th x-text="t('common.errors')"></th><th x-text="t('common.cycle')"></th></tr></thead>
        <tbody>
          <template x-for="d in ch.devices" :key="d.id">
            <tr>
              <td :data-label="t('common.device')"><a :href="deviceHref(d.id)" x-text="deviceName(d, ch)"></a></td>
              <td :data-label="t('common.driver')" x-text="d.driver"></td>
              <td :data-label="t('common.state')"><span :class="stateClass(d.state)" x-text="stateText(d.state)"></span></td>
              <td :data-label="t('common.last_good')" :title="d.last_good" x-text="ago(d.last_good)"></td>
              <td :data-label="t('common.errors')" x-text="errorsText(d)"></td>
              <td :data-label="t('common.cycle')" x-text="ms(d.cycle_ms)"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </section>
  </template>
</section>
</template>

<!-- ============================================================ device page -->
<template x-if="view('device')">
<section x-data="deviceView" id="view-device">
  <div class="toolbar">
    <h1 x-text="id"></h1>
    <div class="actions">
      <button class="primary" x-show="isAdmin() && !missing" :disabled="busy" @click="readOnce()" :title="t('device.read_every_tag_of')" x-text="t('device.read_once')"></button>
      <a class="button" :href="quickHref(id)" x-text="t('common.quick_client')"></a>
      <a class="button" :href="editHref(id)" x-text="t('device.edit_config')"></a>
    </div>
  </div>
  <div x-show="missing">
    <p x-rich="rich('device.not_polled')"></p>
  </div>
  <p class="error" x-show="error" x-text="error"></p>
  <div x-show="detail">
    <p class="muted" x-text="subtitle()"></p>
    <div class="cards">
      <div class="card"><div class="label" x-text="t('common.state')"></div><div class="value"><span :class="stateClass(detail && detail.state)" x-text="stateText(detail && detail.state)"></span></div>
        <div class="sub" x-text="t(detail && detail.connected ? 'device.connected' : 'device.not_connected')"></div></div>
      <div class="card"><div class="label" x-text="t('common.last_good')"></div><div class="value small" x-text="ago(detail && detail.last_good)"></div></div>
      <div class="card"><div class="label" x-text="t('common.errors')"></div><div class="value" x-text="detail ? fmt(detail.errors) : ''"></div><div class="sub" x-text="t('device.failed_cycles')"></div></div>
      <div class="card"><div class="label" x-text="t('common.cycle')"></div><div class="value" x-text="ms(detail && detail.cycle_ms)"></div></div>
    </div>
    <p class="error" x-show="detail && detail.last_error" x-text="t('device.last_error', {error: detail && detail.last_error})"></p>
    <p class="flash flash-ok inline" x-show="readNote" x-text="readNote"></p>
    <h2><span x-text="t('common.live_values')"></span> <small class="muted" x-text="t('device.auto_refresh', {counts: countsText()})"></small></h2>
    <div class="table-wrap">
      <table class="values">
        <thead><tr><th x-text="t('common.tag')"></th><th x-text="t('common.value')"></th><th x-text="t('common.quality')"></th><th x-text="t('common.source_time')"></th></tr></thead>
        <tbody>
          <template x-for="v in values" :key="v.name">
            <tr><td><code x-text="v.name"></code></td><td class="num" x-text="fmt(v.value)"></td><td><span :class="qualityClass(v.quality)" x-text="v.quality"></span></td><td class="muted small" x-text="v.ts || ''"></td></tr>
          </template>
        </tbody>
      </table>
    </div>

    <h2 x-text="t('device.identity')"></h2>
    <div id="identity">
      <p class="muted" x-show="!ident" x-text="t('device.asking_the_device')"></p>
      <p class="error" x-show="ident && ident.error" x-text="ident && ident.error"></p>
      <p class="muted" x-show="ident && !ident.connected" x-text="t('device.not_connected_right_now')"></p>
      <p class="muted" x-show="ident && ident.connected && !has(ident.rows)" x-text="t('device.the_device_does_not')"></p>
      <table class="compact kv" x-show="ident && has(ident.rows)">
        <tbody><template x-for="row in (ident ? ident.rows : [])" :key="row.key"><tr><th x-text="row.key"></th><td class="wrap" x-text="fmt(row.value)"></td></tr></template></tbody>
      </table>
      <button class="small" x-show="isAdmin()" @click="loadIdentity(true)" x-text="t('device.ask_the_device_again')"></button>
    </div>

    <h2 x-text="t('device.block_plan')"></h2>
    <p class="error" x-show="plan && plan.plan_error" x-text="t('device.no_plan', {error: plan && plan.plan_error})"></p>
    <div x-show="plan && !plan.plan_error">
      <p class="muted" x-text="planText()"></p>
      <details>
        <summary x-text="t('device.blocks_n', {n: count(blockRows())})"></summary>
        <div class="table-wrap">
          <table class="compact">
            <thead><tr><th x-text="t('device.rate')"></th><th x-text="t('device.block')"></th><th x-text="t('device.requests')"></th><th x-text="t('common.tags')"></th></tr></thead>
            <tbody><template x-for="(b, i) in blockRows()" :key="i"><tr><td x-text="rateText(b.rate_ms)"></td><td><code x-text="b.describe"></code></td><td x-text="b.wire_requests"></td><td class="wrap" x-text="join(b.tags)"></td></tr></template></tbody>
          </table>
        </div>
      </details>
      <h3><span x-text="t('common.bad_config_tags')"></span> <small class="muted" x-text="t('device.bad_config_n', {n: count(invalidRows())})"></small></h3>
      <p class="muted" x-show="!has(invalidRows())" x-text="t('common.none')"></p>
      <table class="compact" x-show="has(invalidRows())">
        <thead><tr><th x-text="t('common.tag')"></th><th x-text="t('device.reason')"></th></tr></thead>
        <tbody><template x-for="row in invalidRows()" :key="row.name"><tr><td><code x-text="row.name"></code></td><td class="wrap" x-text="row.reason"></td></tr></template></tbody>
      </table>
    </div>
  </div>
</section>
</template>

<!-- ============================================================ Quick Client -->
<template x-if="view('quick')">
<section x-data="quickView" id="view-quick">
  <div class="toolbar">
    <h1 x-text="t('common.quick_client')"></h1>
    <span id="quick-mode" :class="modeClass()" :title="modeTitle()" x-text="modeText()"></span>
  </div>
  <p class="muted small" x-rich="rich('quick.intro')"></p>
  <div class="quick">
    <nav class="quick-tree" :aria-label="t('common.devices')">
      <input type="search" :placeholder="t('common.filter_devices_placeholder')" :aria-label="t('common.filter_devices')" x-model="q">
      <p class="error" x-show="devError" x-text="devError"></p>
      <p class="muted small" x-show="!devError && !has(tree())" x-text="t('quick.no_polled_device_matches')"></p>
      <template x-for="ch in tree()" :key="ch.name">
        <div class="quick-channel">
          <div class="quick-channel-name" x-text="ch.name"></div>
          <ul>
            <template x-for="d in ch.devices" :key="d.id">
              <li><a :href="quickHref(d.id)" :aria-current="d.id === id ? 'true' : null"><span :class="stateDot(d.state)" aria-hidden="true"></span><span x-text="deviceName(d, ch)"></span></a></li>
            </template>
          </ul>
        </div>
      </template>
    </nav>
    <div class="quick-main">
      <p class="muted" x-show="!id" x-text="t('quick.choose_a_device_on')"></p>
      <template x-if="id">
        <div>
          <div class="toolbar">
            <h2 class="quick-title"><a :href="deviceHref(id)" x-text="id"></a></h2>
            <div class="actions">
              <input type="search" :placeholder="t('quick.filter_tags_placeholder')" :aria-label="t('quick.filter_tags')" x-model="tq">
              <button class="primary" x-show="isAdmin()" :disabled="readDisabled()" @click="readNow()" :title="t('quick.read_every_tag_of')" x-text="t('quick.read_now')"></button>
            </div>
          </div>
          <p class="error" role="alert" x-show="error" x-text="error"></p>
          <p class="banner warn" x-show="unavailable" x-text="t('quick.not_polled', {reason: unavailable})"></p>
          <p class="flash flash-ok inline" x-show="readNote" x-text="readNote"></p>
          <p class="muted small" id="quick-counts" x-show="has(rows)" x-text="countsText()"></p>
          <p class="muted" x-show="!unavailable && !has(rows) && loaded" x-text="t('quick.this_device_has_no')"></p>
          <p class="muted" x-show="!unavailable && !loaded" x-text="t('quick.waiting_for_the_first')"></p>
          <div class="table-wrap" x-show="has(rows)">
            <table class="values" id="quick-values">
              <thead><tr><th x-text="t('common.tag')"></th><th class="opt" x-text="t('common.address')"></th><th class="opt" x-text="t('common.type')"></th><th x-text="t('common.value')"></th><th x-text="t('common.quality')"></th><th class="opt" x-text="t('common.source_time')"></th><th x-text="t('quick.age')"></th><th class="opt" x-text="t('quick.updates')"></th></tr></thead>
              <tbody>
                <template x-for="r in shown()" :key="r.tag">
                  <tr :class="rowClass(r)" :data-tag="r.tag">
                    <td><code x-text="r.tag"></code></td>
                    <td class="small opt"><code x-show="r.address" x-text="r.address"></code></td>
                    <td class="small muted opt" x-text="r.dtype"></td>
                    <td :class="valueClass(r)" x-text="fmt(r.value)"></td>
                    <td><span :class="qualityClass(r.quality)" x-text="r.quality"></span></td>
                    <td class="muted small nowrap opt" x-text="tsText(r)"></td>
                    <td :class="ageClass(r)" x-text="age(r)"></td>
                    <td class="num small muted opt" x-text="r.updates"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <p class="muted small" x-show="shownNote()" x-text="shownNote()"></p>
        </div>
      </template>
    </div>
  </div>
</section>
</template>

<!-- ============================================================ config overview -->
<template x-if="view('config')">
<section x-data="configView" id="view-config">
  <div class="toolbar">
    <h1 x-text="t('config.configuration')"></h1>
    <div class="actions">
      <a class="button" href="#/check" x-text="t('config.check_plan')"></a>
      <button @click="exportConfig()" x-text="t('config.export')"></button>
      <button x-show="isAdmin()" class="primary" @click="reload()" x-text="t('config.reload')"></button>
    </div>
  </div>
  <p class="error" x-show="loadError" x-text="loadError"></p>
  <p class="muted" x-rich="rich('config.intro', {rev: rev})"></p>
  <div class="error-box" x-show="summary && summary.error"><strong x-text="t('config.the_config_on_disk')"></strong><span x-text="summary && summary.error"></span>
    <ul><template x-for="(e, i) in diskErrors()" :key="i"><li x-text="e"></li></template></ul></div>
  <h2><span x-text="t('common.channels')"></span> <small class="muted" x-text="t('config.counts', {channels: counts().channels, devices: counts().devices, tags: counts().tags, excluded: counts().excluded})"></small></h2>
  <div class="table-wrap">
    <table class="responsive">
      <thead><tr><th x-text="t('config.channel_site')"></th><th x-text="t('common.enabled')"></th><th x-text="t('common.devices')"></th><th x-text="t('common.override_title')"></th></tr></thead>
      <tbody>
        <template x-for="c in channels" :key="c.name">
          <tr>
            <td :data-label="t('common.channel')"><a :href="channelHref(c.name)" x-text="c.name"></a></td>
            <td :data-label="t('common.enabled')" x-text="yesNo(c.enabled)"></td>
            <td :data-label="t('common.devices')" x-text="c.devices"></td>
            <td :data-label="t('common.override_title')" x-text="overrideText(c)"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
  <p class="muted" x-show="summary && !has(channels)" x-rich="rich('config.no_channels')"></p>
  <form id="channel-create" class="inline-form" x-show="canEdit()" @submit.prevent="addChannel()">
    <div class="error-box" x-show="has(general)"><strong x-text="t('common.not_saved')"></strong><ul><template x-for="(g, i) in general" :key="i"><li x-text="g"></li></template></ul></div>
    <label><span x-text="t('config.new_channel')"></span> <input name="name" x-model="newChannel" :placeholder="t('config.plant_a')" required><span class="field-error" x-show="err('name')" x-text="err('name')"></span></label>
    <button type="submit" x-text="t('config.add_channel')"></button>
  </form>

  <h2><span x-text="t('config.publish_defaults')"></span> <small class="muted" x-rich="rich('config.defaults_note')"></small></h2>
  <form id="map-defaults" class="stack" @submit.prevent="saveDefaults()">
    <fieldset :disabled="!canEdit()">
      <div class="error-box" x-show="has(defaultsErrors)"><strong x-text="t('common.not_saved')"></strong><ul><template x-for="(e, i) in defaultsErrors" :key="i"><li x-text="e"></li></template></ul></div>
      <p class="flash flash-ok inline" x-show="defaultsNote" x-text="defaultsNote"></p>
      <label><span x-text="t('config.defaults_json_publish_settings')"></span>
        <textarea name="defaults" rows="3" spellcheck="false" :placeholder="t('config.env_prod')" x-model="defaultsText"></textarea></label>
      <button type="submit" x-show="canEdit()" x-text="t('config.save_defaults')"></button>
    </fieldset>
  </form>

  <template x-if="has(warnings())">
    <section>
      <h2><span x-text="t('common.warnings')"></span> <small class="muted" x-text="count(warnings())"></small></h2>
      <ul class="warnings"><template x-for="(w, i) in warnings()" :key="i"><li x-text="w"></li></template></ul>
    </section>
  </template>
</section>
</template>

<!-- ============================================================ channel -->
<template x-if="view('channel')">
<section x-data="channelView" id="view-channel">
  <p class="crumbs"><a href="#/config" x-text="t('common.config')"></a> ›</p>
  <div class="toolbar">
    <h1 x-text="name"></h1>
    <div class="actions" x-show="canEdit()"><button class="danger" @click="remove()" x-text="t('channel.delete_channel')"></button></div>
  </div>
  <p class="error" x-show="loadError" x-text="loadError"></p>
  <form id="channel-form" class="grid-form" @submit.prevent="save()" x-show="channel">
    <fieldset :disabled="!canEdit()">
      <div class="error-box" x-show="has(general)"><strong x-text="t('common.not_saved')"></strong><ul><template x-for="(g, i) in general" :key="i"><li x-text="g"></li></template></ul></div>
      <p class="flash flash-ok inline" x-show="note" x-text="note"></p>
      <label><span x-text="t('common.name')"></span> <input name="name" x-model="form.name" required><span class="field-error" x-show="err('name')" x-text="err('name')"></span></label>
      <div class="field"><label class="check"><input type="checkbox" name="enabled" x-model="form.enabled"> <span x-text="t('channel.enabled_devices_json')"></span></label></div>
      <label><span x-text="t('channel.override_overrides_yaml')"></span>
        <select name="override" x-model="form.override">
          <option value="" x-text="t('common.none')"></option><option value="true" x-text="t('channel.force_enabled')"></option><option value="false" x-text="t('channel.force_disabled')"></option>
        </select></label>
      <div class="buttons" x-show="canEdit()"><button type="submit" x-text="t('channel.save_channel')"></button></div>
    </fieldset>
  </form>
  <h2 x-text="t('common.devices')"></h2>
  <div class="table-wrap">
    <table class="responsive">
      <thead><tr><th x-text="t('common.device')"></th><th x-text="t('common.driver')"></th><th x-text="t('common.host')"></th><th x-text="t('common.tags')"></th><th x-text="t('common.enabled')"></th><th x-text="t('common.subdeviceid')"></th></tr></thead>
      <tbody>
        <template x-for="d in devices()" :key="d.id">
          <tr>
            <td :data-label="t('common.device')"><a :href="editHref(d.id)" x-text="d.name"></a> <span class="badge small" x-show="d.has_override" x-text="t('common.override')"></span></td>
            <td :data-label="t('common.driver')" x-text="d.driver"></td>
            <td :data-label="t('common.host')" x-text="d.host + ':' + d.port"></td>
            <td :data-label="t('common.tags')" x-text="d.tags"></td>
            <td :data-label="t('common.enabled')" x-text="yesNo(d.enabled)"></td>
            <td :data-label="t('common.subdeviceid')" x-text="d.sub_device_id || '—'"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
  <template x-if="canEdit()">
    <section>
      <h2 x-text="t('channel.add_a_device')"></h2>
      <form id="device-create" class="grid-form" @submit.prevent="addDevice()">
        <div class="error-box" x-show="has(devGeneral)"><strong x-text="t('common.not_saved')"></strong><ul><template x-for="(g, i) in devGeneral" :key="i"><li x-text="g"></li></template></ul></div>
        <label><span x-text="t('common.name')"></span> <input name="name" x-model="dev.name" :placeholder="t('channel.plc1')" required><span class="field-error" x-show="devErrors.name" x-text="devErrors.name"></span></label>
        <label><span x-text="t('common.driver')"></span> <select name="driver" x-model="dev.driver"><template x-for="d in drivers" :key="d"><option :value="d" x-text="d"></option></template></select><span class="field-error" x-show="devErrors.driver" x-text="devErrors.driver"></span></label>

<template x-if="view('import')">
<section x-data="importView" id="view-import">
  <h1 x-text="t('common.import')"></h1>
  <p class="muted" x-rich="rich('import.intro')"></p>
  <p class="error" x-show="!canEdit()" x-text="editBlockedText()"></p>
  <form id="import-form" class="stack" x-show="canEdit()" @submit.prevent="preview()">
    <label><span x-text="t('import.file')"></span> <input type="file" name="file" accept=".json,application/json" @change="pick($event)" required></label>
    <div class="buttons"><button type="submit" class="primary" :disabled="busy" x-text="t('import.preview_changes_dry_run')"></button></div>
  </form>
  <div id="import-result">
    <div class="error-box" x-show="has(errors)"><strong x-text="t('import.cannot_import', {file: fileName})"></strong><ul><template x-for="(e, i) in errors" :key="i"><li x-text="e"></li></template></ul></div>
    <template x-if="report">
      <div>
        <div class="flash flash-ok" x-show="applied" x-text="t('import.imported', {file: fileName, files: filesText()})"></div>
        <h2 x-show="!applied"><span x-text="t('import.dry_run', {file: fileName})"></span> <small class="muted" x-text="'(' + report.kind + ')'"></small></h2>
        <template x-if="dj()">
          <div>
            <div class="cards">
              <div class="card"><div class="label" x-text="t('common.channels')"></div><div class="value small" x-text="changeCounts('channels')"></div></div>
              <div class="card"><div class="label" x-text="t('common.devices')"></div><div class="value small" x-text="changeCounts('devices')"></div><div class="sub" x-text="t('import.unchanged_n', {n: sum('devices', 'unchanged')})"></div></div>
              <div class="card"><div class="label" x-text="t('common.tags')"></div><div class="value small" x-text="changeCounts('tags')"></div></div>
              <div class="card"><div class="label" x-text="t('import.files')"></div><div class="value small" x-text="filesText()"></div></div>
            </div>
            <details open x-show="has(dj().devices_added)"><summary x-text="t('import.devices_added', {n: count(dj().devices_added)})"></summary>
              <ul><template x-for="d in dj().devices_added" :key="d.id"><li><code x-text="d.id"></code> <span x-text="t('import.device_line', {driver: d.driver, host: d.host, tags: d.tags})"></span></li></template></ul></details>
            <details open x-show="has(dj().devices_removed)"><summary class="danger-text" x-text="t('import.devices_removed', {n: count(dj().devices_removed)})"></summary>
              <ul><template x-for="d in dj().devices_removed" :key="d.id"><li><code x-text="d.id"></code> <span x-text="t('import.device_line', {driver: d.driver, host: d.host, tags: d.tags})"></span></li></template></ul></details>
            <details x-show="has(dj().devices_changed)"><summary x-text="t('import.devices_changed', {n: count(dj().devices_changed)})"></summary>
              <template x-for="d in dj().devices_changed" :key="d.id">
                <div class="diff-device"><code x-text="d.id"></code>
                  <ul>
                    <template x-for="(c, i) in fieldChanges(d)" :key="i"><li x-text="c"></li></template>
                    <li x-show="has(d.tags_added)" x-text="t('import.tags_added', {names: firstNames(d.tags_added)})"></li>
                    <li class="danger-text" x-show="has(d.tags_removed)" x-text="t('import.tags_removed', {names: firstNames(d.tags_removed)})"></li>
                    <template x-for="(c, i) in tagChanges(d)" :key="i"><li x-text="t('import.tag_change', {change: c})"></li></template>
                  </ul>
                </div>
              </template>
            </details>
          </div>
        </template>
        <p x-show="report.devices_map" x-text="stubsText()"></p>
        <template x-for="x in textDiffs()" :key="x.name">
          <details :open="!x.d.unchanged"><summary x-text="x.name + ': ' + textState(x)"></summary><pre class="diff" x-show="!x.d.unchanged" x-text="x.d.diff"></pre></details>
        </template>
        <details x-show="has(problems())"><summary x-text="t('import.problems_n', {n: count(problems())})"></summary><ul class="warnings"><template x-for="(p, i) in problems()" :key="i"><li x-text="p"></li></template></ul></details>
        <details x-show="has(warnings())"><summary x-text="t('import.warnings_n', {n: count(warnings())})"></summary><ul class="warnings"><template x-for="(w, i) in warnings()" :key="i"><li x-text="w"></li></template></ul></details>
        <div class="buttons" x-show="canApply()"><button class="primary" :disabled="busy" @click="apply()" x-text="t('import.apply_import')"></button><span class="muted" x-text="t('import.writes', {files: filesText()})"></span></div>
        <p class="muted" x-show="nothing()" x-text="t('import.nothing_would_change')"></p>
      </div>
    </template>
  </div>
</section>
</template>

<!-- ============================================================ audit -->
<template x-if="view('audit')">
<section x-data="auditView" id="view-audit">
  <div class="toolbar">
    <h1 x-text="t('audit.audit_log')"></h1>
    <form class="inline-form" @submit.prevent="filter()">
      <label><span x-text="t('audit.action')"></span> <input name="action" x-model="action" :placeholder="t('audit.device')"></label>
      <label><span x-text="t('audit.who')"></span> <input name="who" x-model="who"></label>
      <label><span x-text="t('audit.target')"></span> <input name="target" x-model="target"></label>
      <button type="submit" x-text="t('audit.filter')"></button>
    </form>
  </div>
  <p class="error" x-show="error" x-text="error"></p>
  <div class="table-wrap">
    <table class="responsive audit">
      <thead><tr><th x-text="t('audit.when_utc')"></th><th x-text="t('audit.who')"></th><th x-text="t('audit.action')"></th><th x-text="t('audit.target')"></th><th x-text="t('audit.what')"></th></tr></thead>
      <tbody>
        <template x-for="(e, i) in entries" :key="i">
          <tr>
            <td :data-label="t('audit.when')" class="nowrap" :title="e.ts" x-text="when(e)"></td>
            <td :data-label="t('audit.who')"><span x-text="e.who"></span> <span class="muted small" x-text="e.role + ' · ' + e.via"></span></td>
            <td :data-label="t('audit.action')"><code x-text="e.action"></code></td>
            <td :data-label="t('audit.target')" class="wrap" x-text="e.target"></td>
            <td :data-label="t('audit.what')" class="wrap">
              <span class="muted small" x-text="filesText(e)"></span>
              <details x-show="has(e.changes)"><summary x-text="t('audit.changes_n', {n: count(e.changes)})"></summary><ul class="changes"><template x-for="(c, j) in changeRows(e)" :key="j"><li x-text="c"></li></template></ul></details>
              <div class="small" x-show="e.detail" x-text="detailText(e)"></div>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
  <p class="muted" x-show="!has(entries)" x-text="t('audit.no_entries')"></p>
  <p class="pager"><button class="link" x-show="offset > 0" @click="newer()" x-text="t('audit.newer')"></button><button class="link" x-show="more" @click="older()" x-text="t('audit.older')"></button></p>
</section>
</template>
</main>
<footer class="foot" x-rich="rich('shell.footer')"></footer>
</body>
</html>
