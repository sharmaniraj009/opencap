name: CI

# Which checks run when (also in CONTRIBUTING.md, "Opening a PR"):
#   push to main          tests (3.12, 3.13), package, windows (fast suite + service smoke test)
#   pull request          tests (3.12, 3.13), package, windows, and acceptance-pr (3.12) when the PR
#                         touches the paths the acceptance suite exercises (see the changes job)
#   nightly, or manual    acceptance (3.12, 3.13), windows (acceptance + service smoke test)
# Pushes to other branches do not run CI: their pull request does, so nothing runs twice.
# Release tags trigger the release workflow (#34), not this one.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 2 * * *"          # nightly acceptance run (UTC)
  workflow_dispatch:
    inputs:
      outage_s:
        description: "Broker outage in the Phase 1 acceptance test, seconds (600 = the plan's 10 minutes)"
        required: false
        default: "8"
  workflow_call:          # the release workflow runs these checks first (#34)
    inputs:
      outage_s:
        type: string
        required: false
        default: "8"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,all]'          # every driver extra, so every driver's tests run
      - name: Test (not acceptance)
        run: pytest -m "not acceptance" -ra

  package:
    name: wheel and container image
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip
          pip wheel . --no-deps -w dist
      - name: Install the wheel in a clean venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install "$(ls dist/opencap-*.whl)[all]"
          /tmp/wheel-venv/bin/opencap --help
          /tmp/wheel-venv/bin/python -m opencap --help
      - name: Build the container image
        run: docker build -t opencap:ci .
      - name: Smoke-test the container image
        run: |
          mkdir -p /tmp/ci-config && chmod 777 /tmp/ci-config
          docker run --rm opencap:ci --help
          docker run --rm -v /tmp/ci-config:/opencap/config -v "$PWD/tests/fixtures:/in:ro" \
            opencap:ci import-kep /in/project_sample.json
          docker run --rm -v /tmp/ci-config:/opencap/config:ro opencap:ci check
          test "$(docker run --rm --entrypoint id opencap:ci -u)" = "10001"

  windows:
    name: Windows (Python 3.12)
    # FR-13, ADR-0010: Windows is a target platform. Push and PR: the fast suite. Nightly and
    # manual: the acceptance suite. Always: the WinSW service smoke test (D-031). Tests that
    # cannot run on Windows are skipped with a reason (`needs_pty`), shown by -ra.
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      WINSW_URL: https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe
      # sha256 of WinSW-x64.exe v2.12.0, computed from the release download (#35)
      WINSW_SHA256: 05B82D46AD331CC16BDC00DE5C6332C1EF818DF8CEEFCD49C726553209B3A0DA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,all]'
      - name: Test (not acceptance)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: pytest -m "not acceptance" -ra
      - name: Acceptance tests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          OPENCAP_OUTAGE_S: ${{ inputs.outage_s || '8' }}
        run: pytest -m acceptance -ra
      - name: WinSW v2.12.0 (download, check SHA-256)
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'WinSW-x64.exe'
          Invoke-WebRequest -Uri $env:WINSW_URL -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne $env:WINSW_SHA256) { throw "WinSW-x64.exe SHA-256 mismatch: $hash" }
      - name: Service smoke test (install, start, /health, stop, clean exit 0, uninstall)
        run: python deploy/windows/service_smoke.py --winsw (Join-Path $env:RUNNER_TEMP 'WinSW-x64.exe')

  changes:
    name: changed paths, action pins
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      acceptance: ${{ steps.filter.outputs.acceptance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2        # the PR's test merge commit and its first parent, the base branch tip
      - name: Every action is pinned by commit SHA (#79)
        # `uses: owner/repo@<40-hex sha> # vX.Y.Z`; local (./) and docker:// references are exempt.
        run: |
          bad="$(grep -nE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows/*.yml \
                   | grep -vE 'uses:[[:space:]]+(\./|docker://)' \
                   | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)"
          if [ -n "$bad" ]; then
            echo "::error::actions not pinned by a full commit SHA (resolve the tag with git ls-remote):"
            echo "$bad"
            exit 1
          fi
      - name: Does the PR touch what the acceptance suite exercises?
        id: filter
        # No third-party action: HEAD is the test merge commit and HEAD^1 the base branch tip, so
        # this lists exactly the files the PR changes. Paths that select the acceptance run:
        #   src/opencap/        the engine (core, north, drivers, config) and the CLI and logging
        #                       it runs under
        #   tests/helpers/      simulators, test broker, network cut
        #   tests/integration/  the acceptance files and the simulator tests they import from
        #   tests/conftest.py, pyproject.toml   fixtures, markers and the driver/broker library pins
        # If the list cannot be computed, acceptance runs.
        run: |
          if ! files="$(git diff --name-only HEAD^1 HEAD)"; then
            echo "::warning::could not list the files this PR changes; running acceptance"
            echo "acceptance=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Files changed by this PR:"
          echo "$files"
          pattern='^(src/opencap/|tests/helpers/|tests/integration/|tests/conftest\.py$|pyproject\.toml$)'
          if grep -Eq "$pattern" <<< "$files"; then
            echo "acceptance=true" >> "$GITHUB_OUTPUT"
            echo "::notice::acceptance-pr runs: this PR touches a path the acceptance suite exercises"
          else
            echo "acceptance=false" >> "$GITHUB_OUTPUT"
            echo "::notice::acceptance-pr skipped: no path the acceptance suite exercises changed"
          fi

  acceptance-pr:
    name: acceptance (PR, Python 3.12)
    needs: changes
    if: needs.changes.outputs.acceptance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,all]'          # every driver extra, so every acceptance test runs
      - name: Acceptance tests (8 s broker outage, 3 Mosquitto restarts)
        env:
          OPENCAP_OUTAGE_S: "8"
          OPENCAP_REQUIRE_MOSQUITTO: "1"   # #8: Docker is on ubuntu-latest, so the Mosquitto restart test must run, not skip
        run: pytest -m acceptance -ra

  acceptance:
    name: acceptance (Python ${{ matrix.python-version }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,all]'          # every driver extra, so every driver's tests run
      - name: Acceptance tests
        env:
          OPENCAP_OUTAGE_S: ${{ inputs.outage_s || '8' }}
          OPENCAP_REQUIRE_MOSQUITTO: "1"   # #8: Docker is on ubuntu-latest, so the Mosquitto restart test must run, not skip
        run: pytest -m acceptance -ra
