name: Release

# A tagged release (docs/release.md): the Rust engine's checks (rust-engine.yml), the container
# image for linux/amd64 and linux/arm64 (each smoke-tested, then pushed to GHCR), the engine
# binaries for Linux and Windows, the desktop installers with the engine bundled (desktop.yml,
# #58), SBOMs (syft), provenance attestations (GitHub's attestation action) and a GitHub
# Release with SHA256SUMS. No Python wheel, sdist or image: the Rust engine is the only
# engine (ADR-0018).
#
# Publishes only for a pushed tag `v<version>` (the version of engine/Cargo.toml) or a manual
# run on such a tag with dry_run off. Everything else is a dry run that builds and tests all of
# it and publishes nothing: manual runs by default, and pull requests that touch this file, the
# Dockerfile or engine/Cargo.toml. Only GITHUB_TOKEN is used.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "Dockerfile", ".dockerignore", "engine/Cargo.toml"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and test everything, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: version and mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      image: ${{ steps.plan.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\([^"]*\)".*/\1/p}' engine/Cargo.toml | head -n 1)"
          test -n "$version" || { echo "::error::no version in engine/Cargo.toml"; exit 1; }
          publish=false
          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::tag $REF_NAME does not match engine/Cargo.toml version $version (expected v$version)"
              exit 1
            fi
            if [ "$EVENT" = push ] || { [ "$EVENT" = workflow_dispatch ] && [ "$DRY_RUN_INPUT" = false ]; }; then
              publish=true
            fi
          fi
          # SemVer pre-releases (0.2.0-rc.1) are GitHub pre-releases and do not move :latest.
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          image="ghcr.io/${OWNER,,}/opencap"
          {
            echo "version=$version"; echo "publish=$publish"; echo "prerelease=$prerelease"; echo "image=$image"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::opencap $version, ref $REF, publish=$publish, prerelease=$prerelease, image $image"

  ci:
    name: Rust engine checks
    needs: plan
    uses: ./.github/workflows/rust-engine.yml

  binaries:
    name: engine binary (${{ matrix.name }})
    needs: [plan, ci]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, name: linux-x86_64, exe: "", pack: tar}
          - {os: windows-latest, name: windows-x86_64, exe: ".exe", pack: zip}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-18
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: engine
      - name: Build the release binary
        run: cargo build --release --locked --manifest-path engine/Cargo.toml -p opencap-engine
      - name: Check it runs and reports the release version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          bin="engine/target/release/opencap-engine${{ matrix.exe }}"
          "$bin" --version | grep -F "$VERSION"
          "$bin" drivers > /dev/null
          "$bin" check --config demo/config > /dev/null
      - name: Package (binary, licence, notice, example config)
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          dir="opencap-engine-$VERSION-${{ matrix.name }}"
          mkdir -p "pack/$dir"
          cp "engine/target/release/opencap-engine${{ matrix.exe }}" LICENSE NOTICE "pack/$dir/"
          cp -r demo/config "pack/$dir/example-config"
          mkdir -p out
          if [ "${{ matrix.pack }}" = tar ]; then
            tar -C pack -czf "out/$dir.tar.gz" "$dir"
          else
            (cd pack && 7z a -tzip "../out/$dir.zip" "$dir" > /dev/null)
          fi
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-${{ matrix.name }}
          path: out/
          if-no-files-found: error

  image-test:
    name: image ${{ matrix.arch }} (build, smoke test, SBOM)
    needs: [plan, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build linux/${{ matrix.arch }} into the local image store
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"     # no *.dockerbuild artifact (not a release asset)
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: opencap:smoke
          provenance: false
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Smoke test (the CI package job's checks, under QEMU for arm64)
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -x
          plat=(--platform "linux/$ARCH")
          want=$([ "$ARCH" = arm64 ] && echo aarch64 || echo x86_64)
          test "$(docker run --rm "${plat[@]}" --entrypoint uname opencap:smoke -m)" = "$want"
          docker run --rm "${plat[@]}" opencap:smoke --version | grep -F "$VERSION"
          docker run --rm "${plat[@]}" opencap:smoke drivers
          docker run --rm "${plat[@]}" -v "$PWD/demo/config:/opencap/config:ro" opencap:smoke check
          test "$(docker run --rm "${plat[@]}" --entrypoint id opencap:smoke -u)" = "10001"
      - name: SBOM (syft, SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: opencap:smoke
          format: spdx-json
          output-file: opencap-${{ needs.plan.outputs.version }}-image-linux-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.arch }}
          path: opencap-${{ needs.plan.outputs.version }}-image-linux-${{ matrix.arch }}.spdx.json
          if-no-files-found: error

  image-push:
    name: image linux/amd64 + linux/arm64 (push to GHCR, provenance)
    needs: [plan, image-test, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write          # push to ghcr.io with GITHUB_TOKEN
      id-token: write          # provenance attestation (Sigstore)
      attestations: write
    env:
      IMAGE: ${{ needs.plan.outputs.image }}
      VERSION: ${{ needs.plan.outputs.version }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Tags
        id: tags
        run: |
          tags="$IMAGE:$VERSION"
          if [ "$PRERELEASE" = false ]; then tags="$tags,$IMAGE:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "::notice::image tags: $tags (push: $PUBLISH)"
      - name: Log in to ghcr.io (GITHUB_TOKEN)
        if: needs.plan.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build both platforms from the tested layers; push on a release
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.plan.outputs.publish == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.version=${{ needs.plan.outputs.version }}
          provenance: false     # the attestation below is the provenance record
          cache-from: |
            type=gha,scope=image-amd64
            type=gha,scope=image-arm64
      - name: Provenance attestation for the image
        if: needs.plan.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.plan.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Container image"
            echo "- tags: \`${{ steps.tags.outputs.tags }}\`"
            echo "- digest: \`$DIGEST\`"
            echo "- pushed: $PUBLISH"
          } >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: desktop installers (MSI, deb, AppImage; engine bundled)
    needs: [plan, ci]
    uses: ./.github/workflows/desktop.yml

  release:
    name: GitHub Release
    needs: [plan, binaries, image-test, image-push, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write          # create the release
      id-token: write          # provenance attestation (Sigstore)
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # Only this workflow's own artifacts: the run also holds docker/build-push-action's build
      # records (*.dockerbuild), which are not release assets.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: engine-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: opencap-desktop-*      # desktop.yml: the Linux and the Windows installers
          path: assets
          merge-multiple: true
      - name: The release attaches exactly these files
        working-directory: assets
        run: |
          # the installers arrive in deb/, appimage/ and msi/ subfolders: attach plain files
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          expected="opencap-$VERSION-image-linux-amd64.spdx.json
          opencap-$VERSION-image-linux-arm64.spdx.json
          opencap-engine-$VERSION-linux-x86_64.tar.gz
          opencap-engine-$VERSION-windows-x86_64.zip"
          # plus one installer of each kind (named by Tauri after the desktop app's own version)
          actual="$(find . -mindepth 1 -printf '%P\n' | grep -vE '\.(deb|AppImage|msi)$' | LC_ALL=C sort)"
          if [ "$actual" != "$(echo "$expected" | sed 's/^ *//' | LC_ALL=C sort)" ]; then
            echo "::error::unexpected release assets:"; ls -l; exit 1
          fi
          for ext in deb AppImage msi; do
            if [ "$(find . -maxdepth 1 -name "*.$ext" | wc -l)" -ne 1 ]; then
              echo "::error::expected exactly one .$ext installer"; ls -l; exit 1
            fi
          done
      - name: SHA256SUMS
        working-directory: assets
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Provenance attestation for the engine binaries
        if: needs.plan.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/opencap-engine-${{ needs.plan.outputs.version }}-linux-x86_64.tar.gz
            assets/opencap-engine-${{ needs.plan.outputs.version }}-windows-x86_64.zip
      - name: Create the release (gh, GITHUB_TOKEN)
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          flags=(--verify-tag --generate-notes --title "opencap $VERSION")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" "${flags[@]}" assets/*
      - name: Dry run summary
        if: needs.plan.outputs.publish != 'true'
        run: |
          {
            echo "### Dry run: nothing was published"
            echo "A release of opencap $VERSION would attach:"
            echo '```'
            ls -l assets
            echo
            cat assets/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
