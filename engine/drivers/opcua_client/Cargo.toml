[package]
name = "opencap-driver-opcua-client"
description = "opencap engine driver (read-only): OPC UA client, polled Read service, on async-opcua (#46)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
opencap-core.workspace = true
opcua = { package = "async-opcua", version = "0.19", default-features = false, features = ["client"] }
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
opencap-north.workspace = true
opencap-core.workspace = true
opencap-north-opcua = { path = "../../north/opcua" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-util.workspace = true

[lints]
workspace = true
