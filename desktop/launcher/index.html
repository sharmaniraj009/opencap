<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opencap</title>
<link rel="stylesheet" href="launcher.css">
<script src="launcher.js" defer></script>
</head>
<body>
<header class="top">
  <span class="brand">opencap</span>
  <span class="muted">engines</span>
  <button id="open-last" hidden title="Open the engine you opened last"></button>
  <button id="add" class="primary">Add engine</button>
</header>
<main>
  <p id="error" class="error" role="alert" hidden></p>
  <p id="notice" class="notice" role="status" hidden></p>
  <section id="local" class="profile local" hidden aria-labelledby="local-title">
    <div class="row">
      <div>
        <div class="name" id="local-title">Engine bundled with this app</div>
        <div id="local-state" class="small muted">stopped</div>
        <div id="local-paths" class="small muted"></div>
      </div>
      <div class="actions">
        <button id="local-start" class="primary">Start</button>
        <button id="local-stop">Stop</button>
      </div>
    </div>
  </section>
  <ul id="profiles" class="profiles" aria-live="polite"></ul>

  <details id="prefs" class="prefs">
    <summary>Preferences</summary>
    <label class="check"><input type="checkbox" id="pref-autostart"> Start opencap when I log in <span class="muted small" id="pref-autostart-note"></span></label>
    <label class="check"><input type="checkbox" id="pref-tray"> Keep running in the tray when the window is closed <span class="muted small" id="pref-tray-note"></span></label>
    <label class="check" id="pref-engine-row"><input type="checkbox" id="pref-engine"> Start the bundled engine when the app starts</label>
    <label class="check"><input type="checkbox" id="pref-last"> Open the engine opened last when the app starts</label>
    <p class="muted small">Quit from the tray menu (or close the window with the tray switch off) stops the bundled engine.</p>
    <p id="prefs-error" class="error" role="alert" hidden></p>
  </details>

  <dialog id="editor">
    <form id="profile-form" method="dialog">
      <h2 id="editor-title">Add engine</h2>
      <label>Name <input name="name" required placeholder="Plant A" autocomplete="off"></label>
      <label>Address <input name="base_url" required placeholder="http://127.0.0.1:8080" autocomplete="off"></label>
      <label>API token <input name="token" type="password" autocomplete="off" placeholder="leave empty to keep the stored token"></label>
      <label class="check"><input type="checkbox" name="clear_token"> Remove the stored token (engine without tokens)</label>
      <p class="muted small">The token is kept in the system keychain, never in a file.</p>
      <p id="form-error" class="error" role="alert" hidden></p>
      <div class="buttons">
        <button type="submit" class="primary" value="save">Save</button>
        <button type="button" id="cancel">Cancel</button>
      </div>
    </form>
  </dialog>
</main>
<footer class="foot muted small" id="foot"></footer>

<template id="profile-tpl">
  <li class="profile">
    <div class="row">
      <div>
        <div class="name"></div>
        <div class="url muted small"></div>
        <div class="warn small" hidden></div>
      </div>
      <div class="actions">
        <button class="open primary">Open</button>
        <button class="check">Check</button>
        <button class="edit">Edit</button>
        <button class="delete danger">Delete</button>
      </div>
    </div>
    <div class="status muted small">not checked yet</div>
  </li>
</template>
</body>
</html>
