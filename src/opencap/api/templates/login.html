{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="login">
  <h1>Log in</h1>
  <p class="muted">Use an API token from <code>poller.yaml</code> <code>api.tokens</code> (or <code>api.token_env</code>).
  Viewer tokens can look; admin tokens can also change the config.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/ui/login" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Token <input type="password" name="token" autocomplete="off" required autofocus></label>
    <button type="submit" class="primary">Log in</button>
  </form>
</section>
{% endblock %}
