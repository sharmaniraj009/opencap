[package]
name = "opencap-engine"
description = "opencap engine binary: run, check, read"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "opencap-engine"
path = "src/main.rs"

# One feature per driver crate (engine/drivers/<name>), forwarded to the registry crate.
# `default` = every driver that exists; e.g. a Modbus-only build:
#   cargo build -p opencap-engine --no-default-features --features driver-modbus-tcp
[features]
default = ["driver-modbus-tcp", "driver-modbus-rtu", "driver-ab-logix", "driver-melsec-mc", "driver-s7", "driver-omron-fins"]
driver-modbus-tcp = ["opencap-drivers/driver-modbus-tcp"]
driver-modbus-rtu = ["opencap-drivers/driver-modbus-rtu"]
driver-ab-logix = ["opencap-drivers/driver-ab-logix"]
driver-melsec-mc = ["opencap-drivers/driver-melsec-mc"]
driver-s7 = ["opencap-drivers/driver-s7"]
driver-omron-fins = ["opencap-drivers/driver-omron-fins"]

[dependencies]
opencap-core.workspace = true
opencap-drivers.workspace = true
opencap-north.workspace = true
opencap-api.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
indexmap.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true

[lints]
workspace = true
