{% from "_macros.html" import err, general_errors %}
<form id="device-create" class="grid-form" hx-post="/ui/config/device-create/{{ channel.name|q }}" hx-target="this" hx-swap="outerHTML">
  {{ general_errors(dev_general) }}
  <label>Name <input name="name" value="{{ new_device.get('name', '') }}" placeholder="PLC 1" required>{{ err(dev_errors, 'name') }}</label>
  <label>Driver <select name="driver">{% for d in drivers %}<option {% if new_device.get('driver') == d %}selected{% endif %}>{{ d }}</option>{% endfor %}</select>{{ err(dev_errors, 'driver') }}</label>
  <label>Host <input name="host" value="{{ new_device.get('host', '') }}" placeholder="192.0.2.10" required>{{ err(dev_errors, 'host') }}</label>
  <label>Port <input name="port" value="{{ new_device.get('port', '') }}" inputmode="numeric" required>{{ err(dev_errors, 'port') }}</label>
  <label class="wide">Params (YAML or JSON, see docs/driver_params.md)
    <textarea name="params" rows="2" spellcheck="false" placeholder="{unit_id: 1}">{{ new_device.get('params', '') }}</textarea>{{ err(dev_errors, 'params') }}</label>
  <div class="buttons"><button type="submit">Add device</button></div>
</form>
