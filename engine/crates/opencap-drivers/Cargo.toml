[package]
name = "opencap-drivers"
description = "opencap engine driver registry: one static table, one Cargo feature per driver crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# One feature per driver crate in engine/drivers/<name>; `default` = every driver that exists.
# A build without a feature still knows the driver's name and reports "not compiled in".
[features]
default = ["driver-modbus-tcp", "driver-modbus-rtu", "driver-ab-logix", "driver-melsec-mc", "driver-s7", "driver-omron-fins", "driver-simulator"]
driver-modbus-tcp = ["dep:opencap-driver-modbus-tcp"]
driver-modbus-rtu = ["dep:opencap-driver-modbus-rtu"]
driver-ab-logix = ["dep:opencap-driver-ab-logix"]
driver-melsec-mc = ["dep:opencap-driver-melsec-mc"]
driver-s7 = ["dep:opencap-driver-s7"]
driver-omron-fins = ["dep:opencap-driver-omron-fins"]
driver-simulator = ["dep:opencap-driver-simulator"]

[dependencies]
opencap-core.workspace = true
opencap-driver-modbus-tcp = { path = "../../drivers/modbus_tcp", optional = true }
opencap-driver-modbus-rtu = { path = "../../drivers/modbus_rtu", optional = true }
opencap-driver-ab-logix = { path = "../../drivers/ab_logix", optional = true }
opencap-driver-melsec-mc = { path = "../../drivers/melsec_mc", optional = true }
opencap-driver-s7 = { path = "../../drivers/s7", optional = true }
opencap-driver-omron-fins = { path = "../../drivers/omron_fins", optional = true }
opencap-driver-simulator = { path = "../../drivers/simulator", optional = true }

[lints]
workspace = true
