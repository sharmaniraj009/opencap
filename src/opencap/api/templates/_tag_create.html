{% from "_macros.html" import err, general_errors, checkbox %}
<form id="tag-create" class="grid-form" hx-post="/ui/config/tag-create/{{ device_id|p }}" hx-target="this" hx-swap="outerHTML">
  <h3 class="wide">Add a tag</h3>
  {{ general_errors(tag_general) }}
  <label>Name <input name="name" value="{{ new_tag.get('name', '') }}" required>{{ err(tag_errors, 'name') }}</label>
  <label>Address <input name="address" value="{{ new_tag.get('address', '') }}" placeholder="400001 · F8:0 · Tag.Member" required>{{ err(tag_errors, 'address') }}</label>
  <label>Type <select name="dtype">{% for d in dtypes %}<option {% if d == new_tag.get('dtype') %}selected{% endif %}>{{ d }}</option>{% endfor %}</select>{{ err(tag_errors, 'dtype') }}</label>
  <label>Scan ms <input name="scan_ms" value="{{ new_tag.get('scan_ms', '') }}" inputmode="numeric" placeholder="device default">{{ err(tag_errors, 'scan_ms') }}</label>
  <label>Scale <input name="scale" value="{{ new_tag.get('scale', '') }}" placeholder="{raw_lo: 0, raw_hi: 4095, eng_lo: 0, eng_hi: 10}">{{ err(tag_errors, 'scale') }}</label>
  <label>Description <input name="description" value="{{ new_tag.get('description', '') }}">{{ err(tag_errors, 'description') }}</label>
  <div class="field">{{ checkbox('enabled', new_tag.get('enabled', true), 'Enabled') }}</div>
  <div class="buttons"><button type="submit">Add tag</button></div>
</form>
{% if new_row is defined and new_row %}
<template><tbody hx-swap-oob="beforeend:#tags-body">{{ new_row }}</tbody></template>
{% endif %}
